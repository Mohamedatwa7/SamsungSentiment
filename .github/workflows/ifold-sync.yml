# iPhone Duo Competition Watch sync — once daily at 9:00 AM Gulf time until
# Oct 1st, 2026. The endpoint itself also self-disables after the tracking
# end date. Mirrors unpacked-sync.yml.
name: iPhone Duo sync

on:
  schedule:
    # Off-peak minutes fire near-immediately on GitHub (on-the-hour slots
    # queue behind heavy load), so schedule 20 minutes early at an odd minute.
    - cron: "40 4 * * *" # target 09:00 Dubai (UTC+4)
    # Backup slot — GitHub occasionally drops a scheduled firing entirely
    # (it did on Sep 11). The gate below skips it if the day's sync ran.
    - cron: "40 6 * * *" # 10:40 Dubai, dedupe-gated
  workflow_dispatch:
    inputs:
      ingest_only:
        description: "Only harvest completed Apify runs — no new paid scrapes"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Tracking ends Oct 1st, 2026 (00:00 Gulf = Sep 30 20:00 UTC). The
      # endpoint self-disables too; this gate stops pointless requests. The
      # workflow file can be deleted after the window closes.
      - name: Check tracking window
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d%H%M)" -ge 202609302000 ]; then
            echo "iPhone Duo tracking ended Oct 1st, 2026 — skipping."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dedupe for the backup cron slot: skip when a scheduled sync
          # already succeeded today. Manual dispatches always run.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            today=$(date -u +%Y-%m-%d)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/ifold-sync.yml/runs?status=success&event=schedule&created=$today&per_page=5" --jq '.workflow_runs | length' || echo 0)
            if [ "$n" -gt 0 ]; then
              echo "A scheduled sync already succeeded today — backup slot skipping."
              echo "active=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"

      # Fires the scrape actors + RSS only — run harvesting and analysis get
      # their own bounded invocations below (the all-in-one call outgrew the
      # 300s function budget at launch-week corpus size).
      - name: Fire scrapes
        if: steps.gate.outputs.active == 'true' && inputs.ingest_only != true
        run: |
          curl -sS -X POST "https://samsungtrack.com/api/ifold/sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"scrapesOnly": true}' \
            --fail-with-body \
            --max-time 570

      # Let the freshly fired scrape runs finish.
      - name: Wait for scrapes
        if: steps.gate.outputs.active == 'true' && inputs.ingest_only != true
        run: sleep 420

      # Harvest the fresh runs in the SAME cycle (dataset reads are free on
      # Apify — no new actor runs are started). Retried: a timed-out attempt
      # leaves its upserts + warm DB caches behind, so the retry finishes.
      - name: Ingest fresh results
        if: steps.gate.outputs.active == 'true'
        run: |
          ok=0
          for attempt in 1 2 3; do
            if curl -sS -X POST "https://samsungtrack.com/api/ifold/sync" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -d '{"ingestOnly": true}' \
              --fail-with-body \
              --max-time 570; then ok=1; break; fi
            echo "ingest attempt ${attempt} failed — retrying"
            sleep 45
          done
          [ "$ok" = "1" ]

      # Ingest can consume the whole invocation before the LLM analysis phase
      # gets a turn — drain the sentiment backlog with its own time budget.
      - name: Analyze backlog
        if: steps.gate.outputs.active == 'true'
        run: |
          curl -sS -X POST "https://samsungtrack.com/api/ifold/sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"analyzeOnly": true}' \
            --fail-with-body \
            --max-time 570 || true

      # Rebuild the dashboard payload into the edge cache right after data
      # changes, so no visitor pays the slow cold DB read.
      - name: Warm dashboard cache
        if: steps.gate.outputs.active == 'true'
        run: |
          curl -sS -o /dev/null "https://samsungtrack.com/api/ifold" --max-time 240 || true
