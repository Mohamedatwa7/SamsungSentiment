# Galaxy Unpacked campaign sync — twice daily at 9:00 AM and 2:00 PM Gulf
# time (UTC+4) until Aug 1st, 2026. Scheduled here instead of a Vercel cron
# because Hobby-plan crons are limited to once per day; the endpoint itself
# self-disables after the campaign end date, so runs after Aug 1 are no-ops.
name: Galaxy Unpacked sync

on:
  schedule:
    # GitHub queues on-the-hour cron slots behind heavy load (observed ~2.5h
    # late on "0 5"). Off-peak minutes fire near-immediately, so schedule 20
    # minutes early at an odd minute — lands right around the target time.
    - cron: "40 4 * * *" # target 09:00 Dubai (UTC+4)
    - cron: "40 9 * * *" # target 14:00 Dubai (UTC+4)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Fires fresh scrapes and ingests the previous cycle's completed runs.
      - name: Trigger sync (fires scrapes)
        run: |
          curl -sS -X POST "https://samsungtrack.com/api/unpacked/sync" \
            -H "Content-Type: application/json" \
            -d '{"manual": true, "wait": false}' \
            --fail-with-body \
            --max-time 570

      # Let the freshly fired scrape runs finish.
      - name: Wait for scrapes
        run: sleep 420

      # Harvest the fresh runs in the SAME cycle (dataset reads are free on
      # Apify — no new actor runs are started). Without this, each run's own
      # scrape results would only appear at the NEXT scheduled run.
      - name: Ingest fresh results
        run: |
          curl -sS -X POST "https://samsungtrack.com/api/unpacked/sync" \
            -H "Content-Type: application/json" \
            -d '{"manual": true, "ingestOnly": true}' \
            --fail-with-body \
            --max-time 570
